name: Deploy frontend to GitHub Pages

# Root-level adaptation of neurosurgery-video-eval-website/.github/workflows/deploy.yml
# (workflows only run from the repo root, so the subtree's copy is inert here).
on:
  push:
    branches: [main]
    paths:
      - "neurosurgery-video-eval-website/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: neurosurgery-video-eval-website

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: neurosurgery-video-eval-website/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Forks serve from <owner>.github.io/<repo>/, so only the SDSC repo may build for the custom domain root.
          SITE_URL: ${{ github.repository_owner == 'Surgical-Data-Science-Collective' && 'https://eval.surgicalvideo.io/' || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: neurosurgery-video-eval-website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
